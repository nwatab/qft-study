<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" width="300" height="290" font-family="serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c03030"/>
    </marker>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="300" height="290" fill="#ffffff"/>
  <!-- springs between sites (v1 at 30°, v2 at 150°, v3 at 270°, center (150,140), radius 90) -->
  <g stroke="#666" stroke-width="2" stroke-dasharray="6 4">
    <line x1="227.9" y1="95" x2="72.1" y2="95"/>
    <line x1="72.1" y1="95" x2="150" y2="230"/>
    <line x1="150" y1="230" x2="227.9" y2="95"/>
  </g>
  <!-- blocks -->
  <g fill="#ffffff" stroke="#000" stroke-width="2">
    <circle cx="227.9" cy="95" r="14"/>
    <circle cx="72.1" cy="95" r="14"/>
    <circle cx="150" cy="230" r="14"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" fill="#000">
    <text x="227.9" y="95">1</text>
    <text x="72.1" y="95">2</text>
    <text x="150" y="230">3</text>
  </g>
  <!-- center -->
  <circle cx="150" cy="140" r="2.5" fill="#000"/>
  <!-- example displacement of block 1 -->
  <line x1="238.7" y1="86" x2="270" y2="60" stroke="#c03030" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="274" y="52" fill="#c03030" font-style="italic">r<tspan font-size="11" dy="4" font-style="normal">1</tspan></text>
  <!-- axes -->
  <line x1="25" y1="265" x2="70" y2="265" stroke="#333" stroke-width="1.5" marker-end="url(#axis)"/>
  <line x1="25" y1="265" x2="25" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#axis)"/>
  <text x="74" y="270" fill="#333" font-style="italic">e<tspan font-size="11" dy="4">x</tspan></text>
  <text x="18" y="212" fill="#333" font-style="italic">e<tspan font-size="11" dy="4">y</tspan></text>
</svg>
